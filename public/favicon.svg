
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#101C35"/>

  <!-- Browser window -->
  <rect x="5" y="9" width="54" height="44" rx="7" fill="#F8FAFC"/>
  <path d="M5 16a7 7 0 0 1 7-7h40a7 7 0 0 1 7 7v5H5z" fill="#263C60"/>

  <!-- Browser controls -->
  <circle cx="12" cy="15" r="1.5" fill="#FB7185"/>
  <circle cx="18" cy="15" r="1.5" fill="#FBBF24"/>
  <circle cx="24" cy="15" r="1.5" fill="#4ADE80"/>

  <!-- Billing dashboard -->
  <rect x="11" y="26" width="24" height="20" rx="2.5" fill="#E2E8F0"/>
  <path d="M16 31h14M16 35h10M16 39h12"
        stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Digital bill -->
  <path d="M39 26h11v20l-2.75-2-2.75 2-2.75-2-2.75 2z"
        fill="#DBFCE7" stroke="#16A34A"
        stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M42 32h5M42 36h5"
        stroke="#15803D" stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Payment success -->
  <circle cx="46" cy="45" r="9"
          fill="#16A34A" stroke="#101C35" stroke-width="2"/>
  <path d="m42 45 2.5 2.5 5-5"
        fill="none" stroke="#fff" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
